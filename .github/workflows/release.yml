name: Release

# Tag a version and it publishes to Maven Central and creates the GitHub Release:
#   git tag v0.0.1 && git push origin v0.0.1
on:
  push:
    # tag filters are globs, not regexes: filter loosely and validate strictly below
    tags:
      - 'v*'
  # re-run for an existing tag, e.g. once the Maven Central secrets have been added
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing tag to (re)publish, e.g. v0.0.2'
        required: true
        default: v0.0.2

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Resolve the version from the tag
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          ref="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! $ref =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$ref' is not a release tag like v0.0.1 or v0.0.2-rc1"
            exit 1
          fi
          version=${ref#v}
          prerelease=false
          case $version in *-*) prerelease=true ;; esac
          {
            echo "value=$version"
            echo "prerelease=$prerelease"
            echo "tag=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "releasing $version (prerelease=$prerelease)"

      # Maven Central only accepts a groupId whose namespace you own. For GitHub the rule is
      # github.com/<account> -> io.github.<account>, where <account> may be an organisation, and it
      # must be the owner of the repository being released.
      - name: Check the publishing coordinates
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          # strip carriage returns so a CRLF checkout cannot skew the comparison
          value() { grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2- | tr -d '\r'; }
          group=$(value GROUP); repo=$(value POM_GITHUB_REPOSITORY)
          artifact=$(value POM_ARTIFACT_ID); url=$(value POM_URL)
          if grep -qE "^[A-Z_]+=.*TODO" gradle.properties; then
            echo "::error::gradle.properties still contains TODO values (POM_DEVELOPER_ID / POM_DEVELOPER_NAME)."
            exit 1
          fi
          owner=${repo%%/*}
          case $group in
            io.github.*) namespace=${group#io.github.} ;;
            *) namespace= ;;
          esac
          # a granted namespace also covers its sub-groups: io.github.skiesworld.addons is fine
          if [ -n "$namespace" ] && [ "$namespace" != "$owner" ] && [[ $namespace != $owner.* ]]; then
            echo "::error::GROUP ($group) claims the GitHub account '$namespace' but this repository is owned by '$owner'."
            exit 1
          fi
          if [ "$url" != "https://github.com/$repo" ]; then
            echo "::error::POM_URL ($url) must be https://github.com/$repo so the POM points at this repository."
            exit 1
          fi
          echo "publishing $group:$artifact:$RELEASE_VERSION from https://github.com/$repo"

      # Maven Central publishing is optional until the secrets exist: without them the release
      # still produces a GitHub Release with the jars attached.
      - name: Detect Maven Central credentials
        id: central
        env:
          CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASS: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$CENTRAL_USER" ] && [ -n "$CENTRAL_PASS" ] && [ -n "$SIGNING_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD / MAVEN_GPG_PRIVATE_KEY are not set; publishing only the GitHub Release."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Stage the release (jars, pom, sources, javadoc)
        run: ./gradlew assemble plainJavadocJar -PVERSION_NAME=${{ steps.version.outputs.value }}

      - name: Upload artifacts to Maven Central and release
        if: steps.central.outputs.enabled == 'true' 
        # mavenCentralUsername/Password are the Central Portal *user token*, not your login.
        # MAVEN_GPG_PRIVATE_KEY is the `gpg --export-secret-keys --armor <keyid>` output; the key id is
        # derived from it, and the public half must already be reachable on a key server for the portal to
        # verify the .asc files it receives.
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -PVERSION_NAME=${{ steps.version.outputs.value }}

      - name: Note the skipped Central upload
        if: steps.central.outputs.enabled != 'true'
        run: echo "Released to GitHub only; add the Central secrets (see README) to publish to Maven Central."

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          files=(build/libs/qqbot-java-sdk-$VERSION.jar
                 build/libs/qqbot-java-sdk-$VERSION-javadoc.jar
                 build/libs/qqbot-java-sdk-$VERSION-sources.jar)
          # re-running a tag must not fail: upload onto the existing release instead
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            args=()
            [ "$PRERELEASE" = true ] && args+=(--prerelease)
            gh release create "$TAG" --generate-notes "${args[@]}" \
              --title "qqbot-java-sdk $VERSION" "${files[@]}"
          fi
