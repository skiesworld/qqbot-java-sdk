name: Release

# Tag a version and it publishes to Maven Central and creates the GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    # tag filters are globs, not regexes: filter loosely and validate strictly below
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Resolve the version from the tag
        id: version
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not a release tag like v1.2.3 or v1.2.3-rc1"
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          prerelease=false
          case $version in *-*) prerelease=true ;; esac
          {
            echo "value=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "releasing $version (prerelease=$prerelease)"

      # Maven Central only accepts a groupId whose namespace you own. For GitHub the rule is
      # github.com/<account> -> io.github.<account>, where <account> may be an organisation, and it
      # must be the owner of the repository being released.
      - name: Check the publishing coordinates
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          # strip carriage returns so a CRLF checkout cannot skew the comparison
          value() { grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2- | tr -d '\r'; }
          group=$(value GROUP); repo=$(value POM_GITHUB_REPOSITORY)
          artifact=$(value POM_ARTIFACT_ID); url=$(value POM_URL)
          if grep -qE "^[A-Z_]+=.*TODO" gradle.properties; then
            echo "::error::gradle.properties still contains TODO values (POM_DEVELOPER_ID / POM_DEVELOPER_NAME)."
            exit 1
          fi
          owner=${repo%%/*}
          case $group in
            io.github.*) namespace=${group#io.github.} ;;
            *) namespace= ;;
          esac
          # a granted namespace also covers its sub-groups: io.github.skiesworld.addons is fine
          if [ -n "$namespace" ] && [ "$namespace" != "$owner" ] && [[ $namespace != $owner.* ]]; then
            echo "::error::GROUP ($group) claims the GitHub account '$namespace' but this repository is owned by '$owner'."
            exit 1
          fi
          if [ "$url" != "https://github.com/$repo" ]; then
            echo "::error::POM_URL ($url) must be https://github.com/$repo so the POM points at this repository."
            exit 1
          fi
          echo "publishing $group:$artifact:$RELEASE_VERSION from https://github.com/$repo"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Stage the release (jars, pom, sources, javadoc)
        run: ./gradlew assemble plainJavadocJar -PVERSION_NAME=${{ steps.version.outputs.value }}

      - name: Upload artifacts to Maven Central and release
        # mavenCentralUsername/Password are the Central Portal *user token*, not your login.
        # signingInMemoryKey is `gpg --export-secret-keys --armor <keyid>` output.
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -PVERSION_NAME=${{ steps.version.outputs.value }}

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "qqbot-java-sdk $VERSION" \
            build/libs/qqbot-java-sdk-$VERSION.jar \
            build/libs/qqbot-java-sdk-$VERSION-javadoc.jar \
            build/libs/qqbot-java-sdk-$VERSION-sources.jar
