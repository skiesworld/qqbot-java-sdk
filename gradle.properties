org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

# Coordinates. Maven Central only accepts a groupId whose namespace you own:
# github.com/skiesworld -> io.github.skiesworld. An organisation works like a personal account;
# validate it under Central Portal -> Namespaces by installing the "Sonatype Nexus" GitHub app on the
# org (or via a DNS TXT record if skiesworld.dev resolves there).
# The released version comes from the git tag; VERSION_NAME is only the local default.
GROUP=io.github.skiesworld
POM_ARTIFACT_ID=qqbot-java-sdk
VERSION_NAME=1.0.0

POM_NAME=QQ Bot Java SDK
POM_DESCRIPTION=Java SDK for the QQ Official Bot Open Platform (API v2): private chat, groups and guilds
POM_URL=https://github.com/skiesworld/qqbot-java-sdk
POM_GITHUB_REPOSITORY=skiesworld/qqbot-java-sdk
POM_DEVELOPER_ID=skiesworld
POM_DEVELOPER_NAME=SkiesWorld

# Publishing then releases automatically once the Central Portal validation passes
mavenCentralAutomaticPublishing=true
